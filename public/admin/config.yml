backend:
  name: github
  repo: kcplayandwork/Penguin-mama-blog
  branch: main
  base_url: https://penguinmama.blog
  auth_endpoint: api/auth

media_folder: public/images
public_folder: /images
locale: zh_Hant

collections:
  - name: blog
    label: 文章管理
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - label: 標題
        name: title
        widget: string
      - label: 摘要
        name: description
        widget: text
      - label: 分類
        name: category
        widget: select
        options:
          - label: 企鵝寶寶長大中
            value: parenting
          - label: 大人的功課
            value: working
          - label: 兩個人的行李箱
            value: travel
          - label: 住在行李箱的那幾年
            value: solo
      - label: 發布日期
        name: pubDate
        widget: datetime
        format: YYYY-MM-DDTHH:mm:ss
        date_format: YYYY-MM-DD
        time_format: HH:mm
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
      - label: 延伸閱讀
        name: related
        widget: list
        required: false
        hint: 填其他文章的 slug（檔名去掉 .md），例如 single-parent-system
        field:
          label: 文章 slug
          name: slug
          widget: string
      - label: 文章內容
        name: body
        widget: markdown
